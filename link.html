<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>private — adib.dev</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="lock-page">
        <div class="lock-box" id="lockBox">
            <div class="lock-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" style="margin:0 auto 10px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h2>private_storage</h2>
            <p style="font-family:var(--font-mono);">// enter password to access</p>
            <input type="password" id="lockPassword" placeholder="password..." autocomplete="off" />
            <div class="error-msg" id="lockError">access_denied</div>
            <button class="btn btn-primary" onclick="checkPassword()" style="width:100%;justify-content:center;">unlock()</button>
        </div>

        <div class="lock-content" id="lockContent">
            <div style="max-width:560px;margin:0 auto;padding:20px;">
                <h2 style="text-align:center;margin-bottom:6px;color:var(--text);font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;gap:8px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    my_files
                </h2>
                <p style="text-align:center;color:var(--text2);margin-bottom:20px;font-family:var(--font-mono);font-size:0.82rem;">// personal files &amp; documents</p>
                <div class="file-list">
                    <a href="adib.pdf" class="file-item" target="_blank">
                        <span class="file-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                        <span class="file-name">adib.pdf</span>
                        <span class="file-size">PDF</span>
                    </a>
                    <a href="drug.pdf" class="file-item" target="_blank">
                        <span class="file-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                        <span class="file-name">drug.pdf</span>
                        <span class="file-size">PDF</span>
                    </a>
                    <a href="adib.jpg" class="file-item" target="_blank">
                        <span class="file-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
                        <span class="file-name">adib.jpg</span>
                        <span class="file-size">IMG</span>
                    </a>
                    <a href="adibp.jpg" class="file-item" target="_blank">
                        <span class="file-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
                        <span class="file-name">adibp.jpg</span>
                        <span class="file-size">IMG</span>
                    </a>
                    <a href="অনুপস্থিতিজনিত ছুটি মঞ্জুরের আবেদন.pdf" class="file-item" target="_blank">
                        <span class="file-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
                        <span class="file-name">ছুটি_আবেদন.pdf</span>
                        <span class="file-size">PDF</span>
                    </a>
                </div>
                <div style="text-align:center;margin-top:20px;">
                    <a href="index.html" class="btn btn-outline btn-sm">← back_to_home()</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function checkPassword() {
            const input = document.getElementById('lockPassword');
            const error = document.getElementById('lockError');
            const lockBox = document.getElementById('lockBox');
            const content = document.getElementById('lockContent');
            if (input.value === 'adib@boss') {
                lockBox.style.display = 'none';
                content.classList.add('unlocked');
                error.style.display = 'none';
            } else {
                error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }
        document.getElementById('lockPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
